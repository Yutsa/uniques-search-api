[server]
port = 8080

[index]
source = "disk"
path = "./build/full_index.tar.zst"

[index.reload]
enabled = false

# Or fetch the archive from a plain, unauthenticated URL (no cloud SDK, no
# credentials -- just a GET). No hot-reload yet for this source.
# [index]
# source = "http"
# [index.http]
# url = "https://storage.googleapis.com/taum-reunion-public/index/full_index.tar.zst"

[collections]
# Cache maximum size (32 MiB)
max_memory_bytes = 32_000_000
# Time before cleaning collection after initial POST -- 0 = no limit
time_to_live_secs = 0
# Time before cleaning collection after last access -- 0 = no limit
time_to_idle_secs = 0
# Maximum size to POST /api/v2/collection/{id} -- 0 = keep 2MiB default
max_post_payload_bytes = 0

# Optional format filters (omit entire [formats] section to disable)
# [formats]
# reload_interval_secs = 60
#
# [formats.source]
# type = "disk"
# path = "./uniques-http-api/formats"
#
# Or pull the manifest (and sibling format files) over HTTP instead of from disk:
# [formats.source]
# type = "http"
# manifest_url = "https://altered-reunion-formats-prod.s3.fr-par.scw.cloud/manifest.json"
